<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSO</title>
<style>
  :root {
    --ground: #FAF9F6;
    --ink:    #191B1F;
    --soft:   #6A7078;
    --line:   #E4E0D9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F1115;
      --ink:    #ECE9E4;
      --soft:   #9AA1AB;
      --line:   #262B33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
  }
  main { max-width: 34ch; text-align: center; }
  h1 {
    margin: 0 0 10px;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .rule {
    width: 40px;
    height: 2px;
    background: var(--line);
    margin: 0 auto 14px;
    border-radius: 2px;
  }
  p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
  <main>
    <h1>MSO</h1>
    <div class="rule"></div>
    <p>Placeholder page. Content coming soon.</p>
  </main>
</body>
</html>
